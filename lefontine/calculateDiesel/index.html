<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de diesel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="all">
        <h1>Calculadora de diesel</h1>

        <form class="painel">
            <h2>Diesel cavalo</h2>
            <div class="line-input">
                <label for="">Km Total</label>
                <input type="number" placeholder="Ex. 450">
            </div>
            <div class="line-input">
                <label for="">Média</label>
                <input type="number" placeholder="Ex. 2,1">
            </div>
            <div class="line-input">
                <label for="">QTD Tanque (L)</label>
                <input type="number" placeholder="Ex. 412">
            </div>
            <div class="button">
                <button type="button">Calcular</button>
            </div>
            
        </form>

        <section class="painel">
            <h2>Quanto precisa</h2>
            <p id="value1"></p>
            <hr>
            <h2>Abastecer?</h2>
            <p id="value2"></p>
            <hr>
            <h2>Autonomia com reserva</h2>
            <p id="value3"></p>
            <hr>
        </section>
    </section>

</body>

<script src="./scripts.js"></script>

</html>

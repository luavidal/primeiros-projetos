<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>0</h1>
    <button onclick="somador()">+1</button>
</body>
<script>
    let point = document.querySelector('h1');
    let n = 0;

    const somador = () => { 
        n++
        point.innerHTML = n;
    }
</script>
</html>

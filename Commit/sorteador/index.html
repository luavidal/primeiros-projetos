<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
        outline: none;
    }

    body {
        background-color: black;
    }

    section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: black;
        color: white;
    }

    img {
        max-width: 200px;
    }

    h1 {
        font-weight: 900;
        font-size: 56px;
        line-height: 24px;
        margin-bottom: 60px;
    }

    div {}

    p {
        text-align: center;
    }

    input,
    button {
        background-color: gray;
        color: aliceblue;
        font-size: 18px;
        text-shadow: black 0 0 10px;
        border: none;
        border-radius: 10px;
        height: 40px;
        width: 200px;
        margin: 8px 20px 20px;
        padding: 10px;
        appearance: none;
        cursor: default;
    }

    /* Oculta as setinhas no Chrome, Safari, Edge e Opera */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    /* Oculta as setinhas no Firefox */
    input[type="number"] {
        -moz-appearance: textfield;
    }

    button {
        background-color: rgb(77, 121, 12);
        font-weight: 700;
        cursor: pointer;
    }

    button:hover {
        opacity: .8;
    }

    button:active {
        opacity: .6;
    }

    @media screen and (max-width: 768px) {
        * {
            transform: scale(.95);
        }

        div {
            display: flex;
            flex-direction: column;
        }
    }
</style>

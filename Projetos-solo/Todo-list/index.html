<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To Do List</title>
</head>

<body>
    <section class="container">

    <section class="input-registers">
        <h1>To Do List</h1>
        <section class="input-container">
            <input type="text" id="taskInput" placeholder="Adicione uma nova tarefa">
            <button>+</button>
        </section>
        <section class="registers">
            <ul id="taskList"></ul>
        </section>
    </section>

    <section class="deleted-or-completed">
        <!-- Aqui você pode adicionar elementos para exibir tarefas concluídas ou excluídas, se necessário -->
         <p></p>
    </section>

    </section>
</body>
<script src="script.js"></script>

</html>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        outline: none;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background-color: black;
        padding: 10px;
    }

    .options ul {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        /* Cria 3 colunas de tamanhos idênticos */
        gap: 150px;
        /* Adiciona um espaço perfeito entre os lanches */
        list-style: none;
        /* Remove as bolinhas padrão da tag ul */
        padding: 0 300px;
        justify-content: center;
    }

    .options li {
        text-align: center;
        transition: ease-in-out .1s;
        display: default;
        border: 2px solid #8133ff;
        border-radius: 5px;
        padding: 5px;
        font-size: 14px;
    }

    .options li:hover {
        scale: 1.05;
    }

    .header {
        display: flex;
        justify-self: center;
        margin-bottom: 40px;
    }

    ul {
        display: flex;
        gap: 50px;
    }

    button {
        font-size: 24px;
        background-color: #00BE37;
        color: white;
        text-shadow: black 0 0 5px;
        width: 150px;
        height: 100px;
        margin: 0 20px;
        border-radius: 10px;
        font-weight: 600;
        transition: ease-in-out .07s;
    }

    button:hover {
        opacity: .9;
    }

    button:active {
        opacity: 1;
        box-shadow: purple 0 0 5px 3px;
        scale: .98;
    }

    img {
        display: inline-block;
        width: 100%;
        height:75%;
        border-radius: 5px;
    }

    p {
        color: white;
        text-shadow: black 0 0 10px 10px;
    }

    .p1 {
        border-radius: 5px 5px 0 0;
    }

    .p2 {
        border-radius: 0 0 5px 5px;
        color: #00BE37;
        font-weight: bolder;
    }
</style>
